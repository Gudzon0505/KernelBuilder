name: Build Kernels - Gadzhi Sultan Edition (KSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    name: "🚀 Sultan Build"
    runs-on: ubuntu-22.04
    steps:
      - name: 📐 Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 😄 Checkout
        uses: actions/checkout@v4

      - name: ⭐ Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git wget ccache python3 python3-dev jq zip unzip tar flex bison libssl-dev bc libelf-dev

      - name: 🌟 Clone kernel source
        run: |
          # Прямое скачивание твоего Vermeer
          git clone --depth=1 -j $(nproc) --branch vermeer-v-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git vermeer-kernel

      - name: 💫 Get Toolchain (Clang 17)
        run: |
          mkdir -p clang-17
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xvf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C clang-17 --strip-components=1
          echo "$(pwd)/clang-17/bin" >> $GITHUB_PATH

      # ═══════════════════════════════════════════════════════════
      # МАГИЯ: Зачистка "призраков" и фикс atomic64
      # ═══════════════════════════════════════════════════════════
      - name: 😋 Sultan & Ghost Buster Cleanup
        working-directory: vermeer-kernel
        run: |
          # 1. Удаляем битые ссылки Xiaomi
          find . -type d -name "*xiaomi*" -exec rm -rf {} + || true
          find . -name "Kconfig*" | while read f; do
            grep "source " "$f" | cut -d'"' -f2 | while read path; do
              [ ! -f "$path" ] && sed -i "\|source \"$path\"|d" "$f"
            done
          done
          # 2. Фикс ошибки atomic64_t (форсируем 64 бита)
          sed -i '1i #define __REALLY_GET_ATOMIC64__' include/linux/atomic.h || true
          echo "✅ Система очищена и подготовлена к 64-битной плавке"

      - name: 😋 Setup ReSukiSU (Bypass)
        working-directory: vermeer-kernel
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp
          mkdir -p drivers/kernelsu
          cp -a ksutmp/kernel/. drivers/kernelsu/
          sed -i 's/$(error You should use ReSukiSU.*/$(info Bypassed)/g' drivers/kernelsu/Kbuild
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: 😋 Setup SUSFS 2.10
        working-directory: vermeer-kernel
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-5.15 susfs_patches
          SUSFS_PATCH=$(ls susfs_patches/kernel_patches/50_add_susfs_in_*.patch | head -n 1)
          patch -p1 < "$SUSFS_PATCH" || true
          cp -a susfs_patches/kernel_patches/fs/. fs/
          cp -a susfs_patches/kernel_patches/include/linux/. include/linux/
          cd drivers/kernelsu && patch -p1 < "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true

      - name: 👍 Start building the kernel (Sultan Mode)
        working-directory: vermeer-kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          # Создаем конфиг
          make O=out ARCH=arm64 vermeer_defconfig
          
          # СУЛТАНОВСКИЕ ОПТИМИЗАЦИИ (Вырезаем дебаг)
          ./scripts/config --file out/.config -d DEBUG_INFO -d GCOV_KERNEL -d KASAN -d KCSAN -d STACKTRACE
          ./scripts/config --file out/.config -e CONFIG_64BIT -e TCP_CONG_BBR -e CONFIG_KSU -e CONFIG_KSU_SUSFS
          
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: 💛 Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Kernel-Vermeer
          path: vermeer-kernel/out/arch/arm64/boot/Image

      - name: ⏰ Pack Anykernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp vermeer-kernel/out/arch/arm64/boot/Image ./AnyKernel3/
          cd AnyKernel3 && zip -r ../Sultan-Vermeer-KSU-SUSFS.zip *

      - name: 💾 Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gadzhi-Sultan-Edition-ZIP
          path: Sultan-Vermeer-KSU-SUSFS.zip
