name: Build Kernels - Gadzhi Sultan Edition (KSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      susfs_branch:
        description: "SUSFS branch (e.g. gki-android14-5.15)"
        default: "gki-android14-5.15"
        required: false
      kernel_branch:
        description: "Kernel source branch"
        default: "bsp-vermeer-t-oss"
        required: false

jobs:
  Build-Kernel:
    name: "🚀 Sultan Build"
    runs-on: ubuntu-24.04
    steps:
      - name: 📐 Set swap to 10G
        uses: pierotofy/set-swap-space@v1.0.0
        with:
          swap-size-gb: 10

      - name: 😄 Checkout
        uses: actions/checkout@v4

      - name: ⭐ Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison bzip2 ccache curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            zip unzip \
            device-tree-compiler dwarves \
            libelf-dev libssl-dev \
            libarchive-tools liblz4-tool lzop \
            make python3 python3-dev wget \
            jq

      - name: 🌟 Clone kernel source
        run: |
          git clone --depth=1 -j $(nproc) \
            --branch "${{ github.event.inputs.kernel_branch || 'bsp-vermeer-t-oss' }}" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            vermeer-kernel

      - name: 💫 Get Toolchain (Clang 17)
        run: |
          sudo apt-get install -y --no-install-recommends clang-17 lld-17 llvm-17
          echo "/usr/lib/llvm-17/bin" >> $GITHUB_PATH

      - name: 😋 Sultan & Ghost Buster Cleanup
        working-directory: vermeer-kernel
        run: |
          set +e
          echo "[*] Safe Kconfig cleanup sequence initiated..."

          find . -name "Kconfig*" -type f | while read -r f; do
            grep "^source " "$f" | cut -d'"' -f2 | while read -r path; do
              if [ -n "$path" ] && [ ! -f "$path" ]; then
                echo "Removing dead source: $path in $f"
                sed -i "s|source \"$path\"||g" "$f"
              fi
            done
          done

          sed -i '1i #define __REALLY_GET_ATOMIC64__' include/linux/atomic.h || true
          exit 0

      - name: 😋 Setup ReSukiSU (Bypass)
        working-directory: vermeer-kernel
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp
          mkdir -p drivers/kernelsu
          cp -a ksutmp/kernel/. drivers/kernelsu/
          sed -i 's/$(error You should use ReSukiSU.*/$(info Bypassed)/g' \
            drivers/kernelsu/Kbuild

          grep -q "kernelsu" drivers/Makefile || \
            echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: 😋 Setup SUSFS 2.10
        working-directory: vermeer-kernel
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
            -b "${{ github.event.inputs.susfs_branch || 'gki-android14-5.15' }}" susfs_patches
          SUSFS_PATCH=$(ls susfs_patches/kernel_patches/50_add_susfs_in_*.patch | head -n 1)
          patch -p1 < "$SUSFS_PATCH" || true
          cp -a susfs_patches/kernel_patches/fs/. fs/
          cp -a susfs_patches/kernel_patches/include/linux/. include/linux/
          cd drivers/kernelsu
          patch -p1 < \
            "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true

      - name: 👍 Start building the kernel (Sultan Mode)
        working-directory: vermeer-kernel
        run: |
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          )

          echo "[*] DUMPING ALL AVAILABLE DEFCONFIGS:"
          find arch/arm64/configs -type f -name "*defconfig" | sort

          ACTUAL_DEFCONFIG=$(find arch/arm64/configs -type f \
            \( -iname "*vermeer*defconfig" \
               -o -iname "*xaga*defconfig" \
               -o -iname "*waipio*defconfig" \) \
            | sort | head -n 1 | sed 's|.*arch/arm64/configs/||')

          if [ -z "$ACTUAL_DEFCONFIG" ]; then
            ACTUAL_DEFCONFIG=$(find arch/arm64/configs -type f \
              -path "*/vendor/*defconfig" | sort | head -n 1 \
              | sed 's|.*arch/arm64/configs/||')
          fi

          if [ -z "$ACTUAL_DEFCONFIG" ]; then
            echo "[!] Vendor configs not found, falling back to gki_defconfig."
            ACTUAL_DEFCONFIG="gki_defconfig"
          fi

          echo "[+] Target defconfig: $ACTUAL_DEFCONFIG"
          make "${MAKE_ARGS[@]}" "$ACTUAL_DEFCONFIG"

          ./scripts/config --file out/.config \
            -d DEBUG_INFO -d GCOV_KERNEL -d KASAN -d KCSAN -d STACKTRACE
          ./scripts/config --file out/.config \
            -e CONFIG_64BIT -e TCP_CONG_BBR -e CONFIG_KSU -e CONFIG_KSU_SUSFS

          make "${MAKE_ARGS[@]}" olddefconfig

          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          export KBUILD_BUILD_TIMESTAMP="$(git log -1 --format=%cd --date=iso-strict)"
          make "${MAKE_ARGS[@]}" -j$(nproc)

      - name: 💛 Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Kernel-Vermeer
          path: vermeer-kernel/out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: ⏰ Pack Anykernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

          IMAGE="vermeer-kernel/out/arch/arm64/boot/Image"
          [ -f "$IMAGE" ] || { echo "ERROR: kernel image not found"; exit 1; }
          cp "$IMAGE" ./AnyKernel3/

          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=vermeer/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=xaga/g' anykernel.sh
          zip -r ../Sultan-Vermeer-KSU-SUSFS.zip . -x '.git/*' -x 'README.md' -x '*placeholder'

      - name: 💾 Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gadzhi-Sultan-Edition-ZIP
          path: Sultan-Vermeer-KSU-SUSFS.zip
          if-no-files-found: error
